<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>训练记录</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --bg:#0e1014;--card:#171a21;--card2:#1d212a;--line:#272d39;
  --txt:#e9edf5;--muted:#8d97a9;--accent:#3ddc97;--amber:#ffb020;--danger:#ff5f5f;
}
body{
  background:var(--bg);color:var(--txt);font-size:15px;line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:20;background:rgba(14,16,20,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hwrap{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 14px}
.brand{font-weight:700;font-size:17px;letter-spacing:.3px}
#subtitle{color:var(--muted);font-size:12px;margin-left:auto;text-align:right}
#settingsBtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:18px;line-height:1;flex:none}
main{max-width:560px;margin:0 auto;padding:12px 14px 150px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card-title{font-weight:600;font-size:14px;margin-bottom:6px}
.kicker{color:var(--muted);font-size:12px;letter-spacing:.4px}
.muted{color:var(--muted);font-size:13px}
.hero h1{margin:4px 0 6px;font-size:26px}
.hero .btn{margin-top:14px}
h2{font-size:20px;margin:0}
h3{font-size:17px;margin:0 0 8px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.btn{
  display:block;width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);
  background:var(--card2);color:var(--txt);font-size:15px;font-weight:600;text-align:center;
  cursor:pointer;font-family:inherit;
}
.btn.primary{background:var(--accent);color:#06281a;border-color:transparent}
.btn.ghost{background:transparent;color:var(--muted);font-weight:500;border-color:var(--line)}
.btn.danger{color:var(--danger);border-color:#4a2626;background:transparent}
.btn.sm{width:auto;padding:6px 12px;font-size:13px;border-radius:8px;display:inline-block}
.btn.wide{margin-top:4px}
.ex{padding:14px 14px 10px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.ex-name{font-weight:600;font-size:15px}
.ex-meta{color:var(--muted);font-size:12px;margin-top:2px}
.start-hint{font-size:12px;color:var(--amber);margin-top:5px;line-height:1.4}
.thumb{width:66px;height:66px;flex:none;padding:0;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.demo-grid figure{margin:0;background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.demo-grid img{width:100%;aspect-ratio:1/1;object-fit:contain;display:block;background:#fff}
.demo-grid figcaption{font-size:11px;color:#444;text-align:center;padding:4px 0;background:#eceff3}
.demo-sub{font-size:13px;font-weight:600;margin-top:10px}
.exgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.exgrid button{background:none;border:0;padding:0;color:var(--muted);font-size:11px;font-family:inherit;text-align:center;cursor:pointer}
.exgrid img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#fff;border:1px solid var(--line);border-radius:10px;display:block}
.exgrid span{display:block;margin-top:5px;line-height:1.3}
.sets{margin-top:2px}
.set-row{display:grid;grid-template-columns:20px 1fr 1fr 46px;gap:8px;align-items:center;margin-bottom:8px}
.idx{color:var(--muted);font-size:13px;text-align:center}
.field{display:flex;align-items:center;background:#0f1217;border:1px solid var(--line);border-radius:10px;padding:0 8px;height:44px;min-width:0}
.field input{width:100%;border:0;background:transparent;color:var(--txt);font-size:16px;padding:0;outline:none;min-width:0}
.field span{color:var(--muted);font-size:12px;margin-left:4px;flex:none}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
input[type=date]{color:var(--txt);background:transparent;border:0;font-size:16px;width:100%;outline:none;font-family:inherit}
.chk{height:44px;border-radius:10px;border:1px solid var(--line);background:#0f1217;color:#5a6477;font-size:18px;cursor:pointer}
.chk.on{background:var(--accent);border-color:var(--accent);color:#06281a}
details.cue{margin:2px 0 4px;border-top:1px dashed var(--line);padding-top:8px}
details.cue summary{color:var(--muted);font-size:12px;cursor:pointer;list-style:none}
details.cue summary::-webkit-details-marker{display:none}
details.cue summary::before{content:"＋ "}
details.cue[open] summary::before{content:"－ "}
details.cue p{margin:6px 0 0;color:var(--muted);font-size:13px}
details.card summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:" ›";color:var(--muted)}
details.card[open] summary::after{content:" ⌄"}
details.card .body{margin-top:8px;color:var(--muted);font-size:13px}
details.card .body b{color:var(--txt);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.grid2 label,.dateline{font-size:12px;color:var(--muted);display:block}
.dateline{margin-bottom:10px}
.grid2 input,.dateline input{width:100%;height:44px;margin-top:4px;background:#0f1217;border:1px solid var(--line);border-radius:10px;color:var(--txt);font-size:16px;padding:0 8px;outline:none;font-family:inherit;min-width:0}
.hint{color:var(--muted);font-size:12px;margin:10px 0 0}
.body-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.body-row span:nth-child(2),.body-row span:nth-child(3){text-align:right}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:22px 14px}
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.navbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#0f1217;color:var(--muted);font-size:20px;line-height:1;font-family:inherit}
.daylabel{font-weight:600;font-size:15px}
.kcal-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.kcal-top b{font-size:28px;letter-spacing:-.5px}
.kcal-top span{color:var(--muted);font-size:13px}
.bar{height:8px;background:#0f1217;border-radius:99px;overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.bar i.over{background:var(--amber)}
.bar.sm{height:6px;margin-top:6px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.macro-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted)}
.macro-top b{color:var(--txt);font-size:13px;font-weight:600}
.macro-top em{font-style:normal;color:var(--muted);font-size:11px;font-weight:400}
.food-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.food-row:first-of-type{border-top:0}
.food-main{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:2px 6px;border-radius:6px;background:#243040;color:#9fc0e8;margin-right:4px}
.food-note{color:var(--txt)}
.food-nums{color:var(--muted);font-size:12px;white-space:nowrap}
.xbtn{width:30px;height:30px;flex:none;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:16px;line-height:1;font-family:inherit}
.grid2 select{width:100%;height:44px;margin-top:4px;background:#0f1217;border:1px solid var(--line);border-radius:10px;color:var(--txt);font-size:16px;padding:0 8px;outline:none;font-family:inherit;min-width:0;-webkit-appearance:none;appearance:none}
.quickrow{display:flex;gap:8px}
.quickrow .btn{flex:1;padding:12px 6px;font-size:14px}
textarea{width:100%;background:#0f1217;border:1px solid var(--line);border-radius:10px;color:var(--txt);font-size:14px;line-height:1.6;padding:10px;font-family:inherit;resize:vertical;outline:none;min-height:96px}
.hist-ex{font-size:13px;color:var(--muted);margin-top:6px}
.hist-ex b{color:var(--txt);font-weight:600;margin-right:6px}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(14,16,20,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nwrap{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#tabbar button{background:none;border:0;color:var(--muted);padding:9px 0 11px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;cursor:pointer}
#tabbar button.active{color:var(--accent)}
.icon{font-size:19px;line-height:1}
#restbar{
  position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:40;
  max-width:536px;margin:0 auto;background:#13251d;border:1px solid #2f6a4f;border-radius:14px;
  padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.rest-info{display:flex;align-items:center;gap:8px;font-size:13px;color:#a7e8c8}
.rest-info b{font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.rest-actions{display:flex;gap:8px}
.rest-actions button{padding:8px 12px;border-radius:9px;border:1px solid #2f6a4f;background:transparent;color:#a7e8c8;font-size:13px;font-family:inherit;cursor:pointer}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:14px}
.sheet{width:100%;max-width:532px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:env(safe-area-inset-bottom);max-height:90vh;overflow:auto}
.sheet .btn{margin-top:10px}
.sheet p{color:var(--muted);font-size:13px;margin:6px 0 10px}
.big{font-size:40px;color:var(--accent);text-align:center;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px;text-align:center}
.stats b{display:block;font-size:22px;color:var(--txt)}
.stats span{font-size:12px;color:var(--muted)}
#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));
  background:#2a3140;color:var(--txt);font-size:13px;padding:9px 16px;border-radius:99px;z-index:60;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;
}
#toast.show{opacity:1}
.warn{background:#2b1d12;border:1px solid #7a4a1c;color:#ffc37a;font-size:12px;border-radius:10px;padding:8px 10px;margin-bottom:12px}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div>
      <div class="brand">训练记录</div>
      <div id="subtitle">第 1 周</div>
    </div>
    <button id="settingsBtn" data-act="settings" aria-label="设置">⋯</button>
  </div>
</header>

<main id="app"></main>

<div id="restbar" hidden>
  <div class="rest-info"><span class="dot"></span><span>休息</span><b class="t">0:00</b></div>
  <div class="rest-actions">
    <button data-act="addrest">+30s</button>
    <button data-act="skip">跳过</button>
  </div>
</div>

<nav id="tabbar">
  <div class="nwrap">
    <button data-act="tab" data-tab="train" class="active"><span class="icon">🏋️</span>训练</button>
    <button data-act="tab" data-tab="history"><span class="icon">📊</span>记录</button>
    <button data-act="tab" data-tab="food"><span class="icon">🍚</span>饮食</button>
    <button data-act="tab" data-tab="body"><span class="icon">⚖️</span>身体</button>
  </div>
</nav>

<div id="modal" class="modal" hidden></div>
<div id="toast"></div>

<script>
(function(){
'use strict';

var KEY='fitlog_v1', DRAFT_KEY='fitlog_draft_v1';

var EX={
  A:[
    {id:'goblet',name:'高脚杯深蹲',sets:3,reps:'8–12次',rest:120,start:'哑铃/壶铃 12kg',imgs:[{f:'Goblet_Squat',n:''}],cue:'哑铃或壶铃抱在胸前，脚略比肩宽，膝盖顺脚尖方向，蹲到大腿接近平行再站起。'},
    {id:'bench',name:'哑铃平板卧推',sets:3,reps:'8–12次',rest:120,start:'每只 8kg（一对 16kg）',imgs:[{f:'Dumbbell_Bench_Press',n:''}],cue:'肩胛后收下沉，哑铃下放到胸口两侧，推到手臂接近伸直但不锁死。'},
    {id:'row',name:'坐姿绳索划船',sets:3,reps:'10–12次',rest:90,start:'配重 25kg',imgs:[{f:'Seated_Cable_Rows',n:''}],cue:'先收肩胛再拉，肘部贴近身体，回程控制，不要用腰甩。'},
    {id:'rdl',name:'哑铃罗马尼亚硬拉',sets:3,reps:'8–10次',rest:120,start:'每只 10kg',imgs:[{f:'Romanian_Deadlift',n:''}],cue:'屈髋不屈腰，哑铃贴腿下滑到腘绳肌明显拉伸，再用臀发力站直。（图示为杠铃版，发力方式相同）'},
    {id:'ohp',name:'哑铃坐姿肩推',sets:3,reps:'10–12次',rest:90,start:'每只 5kg',imgs:[{f:'Dumbbell_Shoulder_Press',n:''}],cue:'肋骨别外翻，哑铃推到头顶正上方，下放到耳朵高度。'},
    {id:'plank',name:'平板支撑',sets:3,reps:'20–40秒',rest:45,time:true,start:'自重 20–30 秒',imgs:[{f:'Plank',n:''}],cue:'肘在肩正下方，臀腹收紧，腰别塌，保持正常呼吸。'}
  ],
  B:[
    {id:'legpress',name:'腿举',sets:3,reps:'10–12次',rest:120,start:'配重 40kg',imgs:[{f:'Leg_Press',n:''}],cue:'膝盖不锁死，下放到小腿与踏板约90度，脚掌踩稳。'},
    {id:'pulldown',name:'高位下拉',sets:3,reps:'10–12次',rest:90,start:'配重 25kg',imgs:[{f:'Wide-Grip_Lat_Pulldown',n:'宽握高位下拉'}],cue:'胸口微抬，先沉肩再拉，手柄拉到接近锁骨。'},
    {id:'incline',name:'上斜哑铃卧推',sets:3,reps:'8–12次',rest:120,start:'每只 6kg',imgs:[{f:'Incline_Dumbbell_Press',n:''}],cue:'靠背约30度，肘部约45度，别耸肩。'},
    {id:'legcurl',name:'坐姿腿弯举',sets:3,reps:'12–15次',rest:60,start:'配重 15kg',imgs:[{f:'Seated_Leg_Curl',n:''}],cue:'全程控制，下放慢，别用惯性甩。'},
    {id:'arms',name:'哑铃弯举 + 绳索下压',sets:2,reps:'12–15次',rest:60,start:'弯举每只 5kg / 下压 15kg',imgs:[{f:'Dumbbell_Bicep_Curl',n:'哑铃弯举'},{f:'Triceps_Pushdown',n:'绳索下压'}],cue:'两个动作连着做算一组；弯举别借力，下压把手臂伸直。'},
    {id:'carry',name:'农夫行走',sets:3,reps:'30–40秒',rest:60,time:true,start:'每手 10kg',imgs:[{f:'Farmers_Walk',n:''}],cue:'双手提重物，肩胛稳定，小步快走，别耸肩。'}
  ]
};

function esc(v){
  return String(v==null?'':v).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function pad(n){return String(n).padStart(2,'0');}
function today(){
  var d=new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function fmtDate(s){
  if(!s) return '';
  var p=s.split('-');
  return (+p[1])+'月'+(+p[2])+'日';
}
function addDays(ds,n){
  var p=ds.split('-');
  var d=new Date(+p[0], +p[1]-1, +p[2]);
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function weekday(ds){
  var p=ds.split('-');
  var d=new Date(+p[0], +p[1]-1, +p[2]);
  return '周'+'日一二三四五六'.charAt(d.getDay());
}
function nowMs(){return Date.now();}
var idSeq=0;
function newId(){ idSeq++; return nowMs()*1000+idSeq; }

var storageOK=true;
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){
      var s=JSON.parse(raw);
      if(s && Array.isArray(s.sessions)) return {sessions:s.sessions,body:Array.isArray(s.body)?s.body:[],food:Array.isArray(s.food)?s.food:[]};
    }
  }catch(e){storageOK=false;}
  return {sessions:[],body:[]};
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(state)); }
  catch(e){ storageOK=false; toast('当前浏览器无法本地保存，请用「设置 → 导出备份」保存数据'); }
}
function saveDraft(){
  try{
    if(draft) localStorage.setItem(DRAFT_KEY,JSON.stringify(draft));
    else localStorage.removeItem(DRAFT_KEY);
  }catch(e){}
}

var state=load();
var draft=null;
try{
  var d=localStorage.getItem(DRAFT_KEY);
  if(d) draft=JSON.parse(d);
}catch(e){ draft=null; }
if(draft && (!draft.entries || !draft.type)) draft=null;

var tab='train';
var foodDate=today();
var TARGET={kcal:2000,p:135,c:230,f:58};
if(!Array.isArray(state.food)) state.food=[];
var restEnd=0, restTimer=null, saveT=null;

function weekNo(){ return Math.min(12, Math.floor(state.sessions.length/3)+1); }
function sessionSlot(){ return (state.sessions.length%3)+1; }
function nextType(){
  var last=state.sessions[state.sessions.length-1];
  return last && last.type==='A' ? 'B' : 'A';
}
function phaseHint(w){
  if(w<=2) return '动作学习期：每个动作 2 组，每组留 3–4 次余力，先把动作做标准。';
  if(w<=6) return '建立负荷期：3 组，RPE 7–8，每周争取多 1 次或加一点重量。';
  if(w<=11) return '强化期：最后一组可以到 RPE 8–9，但仍然保持动作稳定。';
  return '减载周：组数减到 2 组，重量降 40%，让身体恢复。';
}

/* ---------- 视图 ---------- */

function viewTrain(){
  if(draft) return viewActive();

  var t=nextType(), w=weekNo();
  var last=state.sessions[state.sessions.length-1];
  var lastHtml='';
  if(last){
    lastHtml='<div class="card"><div class="card-title">上次训练</div><div class="muted">'
      + fmtDate(last.date)+' · 训练'+last.type+' · '+last.sets+' 组 · 总容量 '+last.volume+' kg</div></div>';
  }

  return ''
  + (storageOK?'':'<div class="warn">这个浏览器不允许本地存储，记录不会自动保存。请改用系统浏览器打开，并及时导出备份。</div>')
  + '<div class="card hero">'
  +   '<div class="kicker">第 '+w+' 周 · 本周第 '+sessionSlot()+' 次</div>'
  +   '<h1>今天练 '+t+'</h1>'
  +   '<p class="muted" style="margin:0">'+phaseHint(w)+'</p>'
  +   '<button class="btn primary" data-act="start" data-type="'+t+'">开始训练</button>'
  + '</div>'
  + lastHtml
  + '<details class="card"><summary>每周安排</summary><div class="body">'

function parseFoodLines(text, baseDate){
  var out=[];
  text.split(/\r?\n/).forEach(function(line){
    line=line.trim();
    if(!line) return;
    var parts=line.split(/[|｜\t]/).map(function(x){return x.trim();}).filter(function(x){return x!=='';});
    if(parts.length<3) return;
    var i=0, date=baseDate, meal='', note='';
    var m0=parts[i].match(/^(\d{1,2})月(\d{1,2})日$/);
    var m1=parts[i].match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    var m2=parts[i].match(/^(\d{1,2})-(\d{1,2})$/);
    if(m0){ date=baseDate.substring(0,4)+'-'+pad(m0[1])+'-'+pad(m0[2]); i++; }
    else if(m1){ date=m1[1]+'-'+pad(m1[2])+'-'+pad(m1[3]); i++; }
    else if(m2){ date=baseDate.substring(0,4)+'-'+pad(m2[1])+'-'+pad(m2[2]); i++; }
    if(i<parts.length && /^(早餐|午餐|晚餐|加餐|夜宵|零食|全天)$/.test(parts[i])){ meal=parts[i]; i++; }
    if(i<parts.length && !/^[\d.]+$/.test(parts[i]) && !/^\d+(\.\d+)?\s*(kcal|千卡|g|克)$/i.test(parts[i])){ note=parts[i]; i++; }
    var nums=[];
    for(;i<parts.length;i++){
      var clean=parts[i].replace(/[^\d.]/g,'');
      if(clean && !isNaN(parseFloat(clean))) nums.push(parseFloat(clean));
    }
    if(!nums.length) return;
    out.push({date:date, meal:meal||'加餐', note:note, kcal:Math.round(nums[0]||0), p:Math.round(nums[1]||0), c:Math.round(nums[2]||0), f:Math.round(nums[3]||0)});
  });
  return out;
}

/* ---------- 训练流程 ---------- */

function phaseSets(){ var w=weekNo(); return (w<=2||w>=12)?2:3; }

function buildDraft(type){
  var last=null;
  for(var i=state.sessions.length-1;i>=0;i--){
    if(state.sessions[i].type===type){ last=state.sessions[i]; break; }
  }
  var entries=EX[type].map(function(def){
    var prev=null;
    if(last){
      for(var j=0;j<last.entries.length;j++){
        if(last.entries[j].id===def.id){ prev=last.entries[j]; break; }
      }
    }
    var count=Math.min(def.sets, phaseSets());
    var sets=[];
    for(var k=0;k<count;k++){
      var p=prev ? (prev.sets[k] || prev.sets[prev.sets.length-1]) : null;
      sets.push({w:p?p.w:'', r:p?p.r:'', done:false});
    }
    return {id:def.id, name:def.name, first:!prev, sets:sets};
  });
  return {type:type, date:today(), start:nowMs(), entries:entries};
}

function toggleSet(ei,si,el){
  var s=draft.entries[ei].sets[si];
  s.done=!s.done;
  if(el) el.classList.toggle('on', s.done);
  if(s.done) startRest(EX[draft.type][ei].rest);
  saveDraft();
  var c=document.getElementById('doneCount');
  if(c) c.textContent=doneCount();
}

function finish(){
  if(!draft) return;
  var any=false, sets=0, volume=0;
  var entries=draft.entries.map(function(e){
    var ds=e.sets.filter(function(s){return s.done;}).map(function(s){
      return {w:parseFloat(s.w)||0, r:parseFloat(s.r)||0};
    });
    if(ds.length) any=true;
    sets+=ds.length;
    return {id:e.id, name:e.name, sets:ds};
  }).filter(function(e){return e.sets.length;});

  if(!any){ toast('至少完成一组再结束'); return; }

  entries.forEach(function(e){
    var def=null;
    EX[draft.type].forEach(function(x){ if(x.id===e.id) def=x; });
    if(def && def.time) return;
    e.sets.forEach(function(x){ volume += x.w*x.r; });
  });

  var s={
    id:nowMs(),
    date:draft.date,
    type:draft.type,
    week:weekNo(),
    entries:entries,
    sets:sets,
    volume:Math.round(volume),
    minutes:Math.max(1,Math.round((nowMs()-draft.start)/60000))
  };
  state.sessions.push(s);
  save();
  draft=null;
  saveDraft();
  stopRest();
  tab='train';
  render();
  showSummary(s);
}

/* ---------- 休息计时 ---------- */

function startRest(sec){
  restEnd=nowMs()+sec*1000;
  if(restTimer) clearInterval(restTimer);
  restTimer=setInterval(tickRest,250);
  tickRest();
}
function tickRest(){
  var bar=document.getElementById('restbar');
  if(!bar) return;
  var left=Math.max(0,Math.ceil((restEnd-nowMs())/1000));
  if(left<=0){ stopRest(); if(navigator.vibrate) navigator.vibrate([220,120,220]); toast('休息结束，开始下一组'); return; }
  bar.hidden=false;
  bar.querySelector('.t').textContent=Math.floor(left/60)+':'+pad(left%60);
}
function stopRest(){
  if(restTimer){ clearInterval(restTimer); restTimer=null; }
  restEnd=0;
  var bar=document.getElementById('restbar');
  if(bar) bar.hidden=true;
}

    img.dataset.fb='1';
    img.src=img.dataset.raw;
  }
}, true);

document.addEventListener('click', function(ev){
  var el=ev.target.closest('[data-act]');
  if(!el) return;
  var act=el.dataset.act;

  if(act==='tab'){
    tab=el.dataset.tab;
    render();
    return;
  }
  if(act==='start'){
    if(draft){
      if(!confirm('有未完成的训练，要放弃并重新开始吗？')) return;
    }
    draft=buildDraft(el.dataset.type);
    saveDraft();
    render();
    return;
  }
  if(act==='toggle'){
    toggleSet(+el.dataset.ex, +el.dataset.set, el);
    return;
  }
  if(act==='finish'){ finish(); return; }
  if(act==='cancel'){
    if(confirm('放弃本次训练？已填写的内容会丢失。')){
      draft=null; saveDraft(); stopRest(); render();
    }
    return;
  }
  if(act==='skip'){ stopRest(); return; }
  if(act==='addrest'){
    if(restEnd){ restEnd+=30000; tickRest(); }
    return;
  }
  if(act==='del'){
    if(confirm('删除这条训练记录？')){
      var id=+el.dataset.id;
      state.sessions=state.sessions.filter(function(x){return x.id!==id;});
      save(); render();
    }
    return;
  }
  if(act==='copyyesterday'){
    var src=foodOf(addDays(foodDate,-1));
    if(!src.length){ toast('昨天没有记录，先手动加一次，以后就能一键复制'); return; }
    var have=foodOf(foodDate).length;
    if(have && !confirm('当天已有 '+have+' 条记录，仍要追加昨天的 '+src.length+' 条吗？')) return;
    src.forEach(function(e){
      state.food.push({id:newId(),date:foodDate,meal:e.meal,note:e.note,kcal:e.kcal,p:e.p,c:e.c,f:e.f});
    });
    save(); render(); toast('已复制 '+src.length+' 条');
    return;
  }
  if(act==='openpaste'){
    var box=document.getElementById('pastebox');
    if(box){
      box.hidden=!box.hidden;
      if(!box.hidden) document.getElementById('fPaste').focus();
    }
    return;
  }
  if(act==='parsepaste'){
    var ta=document.getElementById('fPaste');
    var items=parseFoodLines(ta?ta.value:'', foodDate);
    if(!items.length){ toast('没识别到，检查一下格式'); return; }
    items.forEach(function(it){
      state.food.push({id:newId(),date:it.date,meal:it.meal,note:it.note,kcal:it.kcal,p:it.p,c:it.c,f:it.f});
    });
    foodDate=items[items.length-1].date;
    save(); render(); toast('已添加 '+items.length+' 条');
    return;
  }
  if(act==='prevday'){ foodDate=addDays(foodDate,-1); render(); return; }
  if(act==='nextday'){ foodDate=addDays(foodDate,1); render(); return; }
  if(act==='delfood'){
    var fid=+el.dataset.id;
    state.food=state.food.filter(function(x){return x.id!==fid;});
    save(); render();
    return;
  }
  if(act==='demo'){ openDemo(el.dataset.name); return; }
  if(act==='settings'){ openSettings(); return; }
  if(act==='close'){ closeModal(); return; }
  if(act==='export'){ doExport(); return; }
  if(act==='clear'){
    if(confirm('确定清空全部训练和身体记录？此操作不可恢复。') && confirm('再确认一次：清空后无法找回。')){
      state={sessions:[],body:[],food:[]};
      draft=null;
      save(); saveDraft(); closeModal(); render();
      toast('已清空');
    }
    return;
  }
});

document.addEventListener('input', function(ev){
  var inp=ev.target.closest('input[data-ex]');
  if(!inp || !draft) return;
  var ei=+inp.dataset.ex, si=+inp.dataset.set, field=inp.dataset.field;
  if(!draft.entries[ei] || !draft.entries[ei].sets[si]) return;
  draft.entries[ei].sets[si][field]=inp.value;
  if(saveT) clearTimeout(saveT);
  saveT=setTimeout(saveDraft,300);
});

document.addEventListener('submit', function(ev){
  if(ev.target.id==='foodForm'){
    ev.preventDefault();
    var kcal=parseFloat(document.getElementById('fKcal').value)||0;
    var p=parseFloat(document.getElementById('fP').value)||0;
    var c=parseFloat(document.getElementById('fC').value)||0;
    var f=parseFloat(document.getElementById('fF').value)||0;
    if(kcal<=0 && p<=0){ toast('至少填热量或蛋白质'); return; }
    state.food.push({
      id:nowMs(),
      date:foodDate,
      meal:document.getElementById('fMeal').value,
      note:(document.getElementById('fNote').value||'').trim(),
      kcal:Math.round(kcal),
      p:Math.round(p),
      c:Math.round(c),
      f:Math.round(f)
    });
    save(); render(); toast('已添加');
    return;
  }
  if(ev.target.id!=='bodyForm') return;
  ev.preventDefault();
  var d=document.getElementById('bDate').value || today();
  var w=parseFloat(document.getElementById('bWeight').value);
  var wa=parseFloat(document.getElementById('bWaist').value);
  if(!(w>0)){ toast('请填写体重'); return; }
  var rec={date:d, weight:Math.round(w*10)/10, waist:(wa>0?Math.round(wa*10)/10:null)};
  var replaced=false;
  for(var i=0;i<state.body.length;i++){
    if(state.body[i].date===d){ state.body[i]=rec; replaced=true; break; }
  }
  if(!replaced) state.body.push(rec);
  save(); render(); toast('已保存');
});

document.addEventListener('change', function(ev){
  if(ev.target.id!=='importFile') return;
  var f=ev.target.files && ev.target.files[0];
  if(!f) return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var data=JSON.parse(String(reader.result));
      if(!data || !Array.isArray(data.sessions)) throw new Error('bad');
      if(!confirm('导入会覆盖当前全部记录，确定吗？')) return;
      state={sessions:data.sessions, body:Array.isArray(data.body)?data.body:[], food:Array.isArray(data.food)?data.food:[]};
      draft=null; save(); saveDraft(); closeModal(); render();
      toast('导入成功');
    }catch(e){ toast('文件格式不正确'); }
  };
  reader.readAsText(f);
});

function doExport(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='fitlog-'+today()+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },1500);
  toast('已导出，请保存到微信或网盘');
}

/* ---------- 启动 ---------- */
render();
})();
</script>
</body>
</html>
