<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1f4f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>训练记录</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --bg:#f1f4f6;--card:#ffffff;--soft:#f7f9fb;--line:#dce3e9;
  --txt:#1b2430;--muted:#5f6b7a;--accent:#2f7d6d;--accent2:#25685a;
  --amber:#a86400;--danger:#c0392b;
}
body{
  background:var(--bg);color:var(--txt);font-size:16px;line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:20;background:rgba(241,244,246,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hwrap{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 14px}
.brand{font-weight:700;font-size:18px}
#subtitle{color:var(--muted);font-size:12px;margin-left:auto;text-align:right;line-height:1.4}
#settingsBtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:19px;line-height:1;flex:none}
main{max-width:560px;margin:0 auto;padding:12px 14px 150px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 1px 2px rgba(20,40,60,.03)}
.card-title{font-weight:700;font-size:15px;margin-bottom:8px}
.kicker{color:var(--muted);font-size:12px;letter-spacing:.4px}
.muted{color:var(--muted);font-size:13px}
.hero h1{margin:4px 0 8px;font-size:27px}
.hero .btn{margin-top:14px}
h2{font-size:21px;margin:0}
h3{font-size:18px;margin:0 0 8px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.btn{
  display:block;width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);
  background:var(--soft);color:var(--txt);font-size:16px;font-weight:600;text-align:center;
  cursor:pointer;font-family:inherit;
}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.primary:active{background:var(--accent2)}
.btn.ghost{background:transparent;color:var(--muted);font-weight:500}
.btn.danger{color:var(--danger);border-color:#e7c2bd;background:transparent}
.btn.sm{width:auto;padding:7px 13px;font-size:14px;border-radius:9px;display:inline-block}
.btn.wide{margin-top:4px}
.ex{padding:15px 15px 12px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.ex-head>div{flex:1;min-width:0}
.ex-name{font-weight:700;font-size:16px}
.ex-meta{color:var(--muted);font-size:13px;margin-top:3px}
.start-hint{font-size:13px;color:var(--amber);margin-top:6px;line-height:1.45}
.vid{display:inline-block;margin-top:6px;font-size:13px;color:var(--accent);text-decoration:none;border-bottom:1px dashed #9ccbbd;padding-bottom:1px}
.sets{margin-top:2px}
.set-row{display:grid;grid-template-columns:20px 1fr 1fr 50px;gap:8px;align-items:center;margin-bottom:9px}
.idx{color:var(--muted);font-size:14px;text-align:center}
.field{display:flex;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:0 8px;height:48px;min-width:0}
.field input{width:100%;border:0;background:transparent;color:var(--txt);font-size:17px;padding:0;outline:none;min-width:0}
.field span{color:var(--muted);font-size:12px;margin-left:4px;flex:none}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
input[type=date]{color:var(--txt);background:transparent;border:0;font-size:16px;width:100%;outline:none;font-family:inherit}
.chk{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:#a9b4c0;font-size:20px;cursor:pointer;font-family:inherit}
.chk.on{background:var(--accent);border-color:var(--accent);color:#fff}
details.cue{margin:4px 0 4px;border-top:1px dashed var(--line);padding-top:8px}
details.cue summary{color:var(--muted);font-size:13px;cursor:pointer;list-style:none}
details.cue summary::-webkit-details-marker{display:none}
details.cue summary::before{content:"＋ "}
details.cue[open] summary::before{content:"－ "}
details.cue p{margin:6px 0 0;color:var(--muted);font-size:14px}
details.card summary{cursor:pointer;font-weight:700;font-size:15px;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:" ›";color:var(--muted)}
details.card[open] summary::after{content:" ⌄"}
details.card .body{margin-top:8px;color:var(--muted);font-size:14px;line-height:1.7}
details.card .body b{color:var(--txt);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.grid2 label,.dateline{font-size:13px;color:var(--muted);display:block}
.dateline{margin-bottom:10px}
.grid2 input,.grid2 select,.dateline input{width:100%;height:48px;margin-top:4px;background:var(--soft);border:1px solid var(--line);border-radius:10px;color:var(--txt);font-size:16px;padding:0 9px;outline:none;font-family:inherit;min-width:0;-webkit-appearance:none;appearance:none}
.hint{color:var(--muted);font-size:13px;margin:10px 0 0}
.body-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.body-row span:nth-child(2),.body-row span:nth-child(3){text-align:right}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:24px 14px;line-height:1.8}
.hist-ex{font-size:14px;color:var(--muted);margin-top:7px}
.hist-ex b{color:var(--txt);font-weight:600;margin-right:6px}
/* 每日打卡 */
.day-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.day-item:first-of-type{border-top:0}
.daycheck{all:unset;display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.day-item .box{width:24px;height:24px;flex:none;border-radius:7px;border:1.5px solid #b9c4cf;background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
.day-item.on .box{background:var(--accent);border-color:var(--accent)}
.day-item.on .lbl{color:var(--muted);text-decoration:line-through}
.daypic{flex:none;width:38px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--accent);font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit}
.progress{height:8px;background:#e6ebef;border-radius:99px;overflow:hidden;margin:10px 0 4px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
/* 示范图 */
.thumb{width:66px;height:66px;flex:none;padding:0;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:100%;height:100%;display:block;background:var(--soft)}
.demo-link{margin:0 0 10px;background:none;border:0;padding:0;font-size:13px;color:var(--accent);font-family:inherit;cursor:pointer}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.demo-grid figure{margin:0;background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.demo-grid img{width:100%;aspect-ratio:1/1;object-fit:contain;display:block;background:#fff}
.demo-grid figcaption{font-size:11px;color:#444;text-align:center;padding:4px 0;background:#eceff3}
.diagram{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}
.diagram svg{width:100%;height:auto;display:block}
/* 饮食 */
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.navbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--muted);font-size:21px;line-height:1;font-family:inherit}
.daylabel{font-weight:700;font-size:16px}
.kcal-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.kcal-top b{font-size:29px;letter-spacing:-.5px}
.kcal-top span{color:var(--muted);font-size:13px}
.bar{height:9px;background:#e6ebef;border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.bar i.over{background:#e0a100}
.bar.sm{height:7px;margin-top:6px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.macro-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted)}
.macro-top b{color:var(--txt);font-size:13px}
.macro-top em{font-style:normal;color:var(--muted);font-size:11px;font-weight:400}
.food-row{display:flex;align-items:flex-start;gap:8px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.food-row:first-of-type{border-top:0}
.food-main{flex:1;min-width:0}
.food-desc{line-height:1.55;word-break:break-word}
.tag{display:inline-block;font-size:11px;padding:2px 6px;border-radius:6px;background:#e3f0ec;color:#2f7d6d;margin-right:4px}
.food-nums{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.5}
.food-empty{color:var(--muted);font-size:14px;text-align:center;padding:16px 0}
.xbtn{width:34px;height:34px;flex:none;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:17px;line-height:1;font-family:inherit}
.quickrow{display:flex;gap:8px}
.quickrow .btn{flex:1;padding:13px 6px;font-size:15px}
textarea{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:10px;color:var(--txt);font-size:14px;line-height:1.6;padding:10px;font-family:inherit;resize:vertical;outline:none;min-height:100px}
/* 底部导航 */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nwrap{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#tabbar button{background:none;border:0;color:var(--muted);padding:9px 0 11px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;cursor:pointer}
#tabbar button.active{color:var(--accent);font-weight:700}
.icon{font-size:20px;line-height:1}
/* 休息条 */
#restbar{
  position:fixed;left:12px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:40;
  max-width:536px;margin:0 auto;background:#e8f3ef;border:1px solid #9ccbbd;border-radius:14px;
  padding:11px 13px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  box-shadow:0 8px 24px rgba(30,60,50,.15);
}
.rest-info{display:flex;align-items:center;gap:8px;font-size:14px;color:#1f5f50}
.rest-info b{font-size:21px;color:var(--accent);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.rest-actions{display:flex;gap:8px}
.rest-actions button{padding:9px 13px;border-radius:9px;border:1px solid #9ccbbd;background:transparent;color:#1f5f50;font-size:14px;font-family:inherit;cursor:pointer}
/* 弹窗 */
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,32,42,.45);display:flex;align-items:flex-end;justify-content:center;padding:14px}
.sheet{width:100%;max-width:532px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:env(safe-area-inset-bottom);max-height:90vh;overflow:auto}
.sheet .btn{margin-top:10px}
.sheet p{color:var(--muted);font-size:14px;margin:6px 0 10px}
.big{font-size:42px;color:var(--accent);text-align:center;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px;text-align:center}
.stats b{display:block;font-size:23px}
.stats span{font-size:12px;color:var(--muted)}
#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(145px + env(safe-area-inset-bottom));
  background:#2b3a45;color:#fff;font-size:14px;padding:10px 17px;border-radius:99px;z-index:60;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;
}
#toast.show{opacity:1}
.warn{background:#fff5f2;border:1px solid #f0c3ae;color:#9a4a25;font-size:13px;border-radius:10px;padding:10px 12px;margin-bottom:12px;line-height:1.6}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div>
      <div class="brand">妈妈的训练记录</div>
      <div id="subtitle">第 1 次</div>
    </div>
    <button id="settingsBtn" data-act="settings" aria-label="设置">⋯</button>
  </div>
</header>

<main id="app"></main>

<div id="restbar" hidden>
  <div class="rest-info"><span class="dot"></span><span>休息</span><b class="t">0:00</b></div>
  <div class="rest-actions">
    <button data-act="addrest">+30秒</button>
    <button data-act="skip">跳过</button>
  </div>
</div>

<nav id="tabbar">
  <div class="nwrap">
    <button data-act="tab" data-tab="train" class="active"><span class="icon">🏠</span>训练</button>
    <button data-act="tab" data-tab="history"><span class="icon">📋</span>记录</button>
    <button data-act="tab" data-tab="food"><span class="icon">🍚</span>饮食</button>
    <button data-act="tab" data-tab="body"><span class="icon">⚖️</span>身体</button>
  </div>
</nav>

<div id="modal" class="modal" hidden></div>
<div id="toast"></div>

<script>
(function(){
'use strict';

var KEY='fitlog_mom_v1', DRAFT_KEY='fitlog_mom_draft_v1';
var TARGET={kcal:1500,p:80,c:180,f:50};

var SVG={
  breath:'<svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg"><g stroke="#2f7d6d" stroke-width="5" fill="none" stroke-linecap="round"><circle cx="95" cy="38" r="15"/><path d="M95 53V64"/><rect x="68" y="64" width="56" height="66" rx="22"/></g><path d="M124 86Q148 96 124 110" fill="none" stroke="#b9c4cf" stroke-width="4" stroke-dasharray="5 5" stroke-linecap="round"/><path d="M126 98H148" stroke="#d98b1f" stroke-width="4" stroke-linecap="round"/><path d="M148 98l-8-4v8z" fill="#d98b1f"/></svg>',
  chin:'<svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg"><g stroke="#2f7d6d" stroke-width="5" fill="none" stroke-linecap="round"><circle cx="112" cy="50" r="17"/><path d="M112 67L106 90"/><path d="M70 98H152"/></g><circle cx="142" cy="50" r="17" fill="none" stroke="#b9c4cf" stroke-width="4" stroke-dasharray="5 5"/><path d="M138 42H114" stroke="#d98b1f" stroke-width="4" stroke-linecap="round"/><path d="M112 42l9-4v8z" fill="#d98b1f"/></svg>',
  thoracic:'<svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg"><path d="M150 74V122H194" fill="none" stroke="#b9c4cf" stroke-width="4" stroke-linecap="round"/><g stroke="#2f7d6d" stroke-width="5" fill="none" stroke-linecap="round"><path d="M160 120L152 86"/><circle cx="150" cy="70" r="14"/><path d="M160 120V134"/></g><g stroke="#b9c4cf" stroke-width="4" fill="none" stroke-dasharray="5 5" stroke-linecap="round"><path d="M160 120L168 86"/><circle cx="169" cy="70" r="14"/></g><path d="M186 106Q202 94 192 82" fill="none" stroke="#d98b1f" stroke-width="4" stroke-linecap="round"/><path d="M192 82l-2 9 8-3z" fill="#d98b1f"/></svg>',
  wallangel:'<svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg"><path d="M48 20V138" stroke="#2f7d6d" stroke-width="5" stroke-linecap="round"/><path d="M40 30l10-6M40 52l10-6M40 74l10-6M40 96l10-6" stroke="#b9c4cf" stroke-width="3" stroke-linecap="round"/><g stroke="#2f7d6d" stroke-width="5" fill="none" stroke-linecap="round"><circle cx="118" cy="46" r="14"/><path d="M118 60V122"/><path d="M88 72H148"/><path d="M88 72H72V46"/><path d="M148 72H164V46"/></g><path d="M72 42V28" stroke="#d98b1f" stroke-width="4" stroke-linecap="round"/><path d="M72 24l-4 9h8z" fill="#d98b1f"/><path d="M164 42V28" stroke="#d98b1f" stroke-width="4" stroke-linecap="round"/><path d="M164 24l-4 9h8z" fill="#d98b1f"/></svg>',
  doorway:'<svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg"><path d="M55 18V140M185 18V140M55 18H185" fill="none" stroke="#b9c4cf" stroke-width="4" stroke-linecap="round"/><g stroke="#2f7d6d" stroke-width="5" fill="none" stroke-linecap="round"><circle cx="120" cy="58" r="14"/><path d="M120 72V128"/><path d="M104 80H88V56"/><path d="M136 80H152V56"/></g><path d="M110 100H96" stroke="#d98b1f" stroke-width="4" stroke-linecap="round"/><path d="M94 100l9-4v8z" fill="#d98b1f"/><path d="M130 100H144" stroke="#d98b1f" stroke-width="4" stroke-linecap="round"/><path d="M146 100l-9-4v8z" fill="#d98b1f"/></svg>',
  scap:'<svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg"><g stroke="#2f7d6d" stroke-width="5" fill="none" stroke-linecap="round"><circle cx="120" cy="42" r="14"/><path d="M82 68H158"/><path d="M92 68L88 120"/><path d="M148 68L152 120"/></g><path d="M120 74V118" stroke="#b9c4cf" stroke-width="4" stroke-dasharray="5 5" stroke-linecap="round"/><path d="M84 74L106 84" stroke="#d98b1f" stroke-width="4" stroke-linecap="round"/><path d="M108 85l-9-3 3 8z" fill="#d98b1f"/><path d="M156 74L134 84" stroke="#d98b1f" stroke-width="4" stroke-linecap="round"/><path d="M132 85l9-3-3 8z" fill="#d98b1f"/></svg>',
  trap:'<svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg"><g stroke="#2f7d6d" stroke-width="5" fill="none" stroke-linecap="round"><path d="M86 88H154"/><path d="M120 88L136 72"/><circle cx="142" cy="62" r="16"/></g><circle cx="120" cy="54" r="16" fill="none" stroke="#b9c4cf" stroke-width="4" stroke-dasharray="5 5"/><path d="M130 44Q152 52 156 74" fill="none" stroke="#d98b1f" stroke-width="4" stroke-linecap="round"/><path d="M156 78l2-10-8 4z" fill="#d98b1f"/><path d="M86 92V108" stroke="#d98b1f" stroke-width="4" stroke-linecap="round"/><path d="M86 112l-4-9h8z" fill="#d98b1f"/></svg>',
  wallsit:'<svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg"><path d="M58 18V140" stroke="#2f7d6d" stroke-width="5" stroke-linecap="round"/><path d="M50 30l10-6M50 52l10-6M50 74l10-6M50 96l10-6" stroke="#b9c4cf" stroke-width="3" stroke-linecap="round"/><g stroke="#2f7d6d" stroke-width="5" fill="none" stroke-linecap="round"><circle cx="58" cy="46" r="13"/><path d="M58 59V96"/><path d="M58 96H104"/><path d="M104 96V134"/><path d="M104 134H78"/></g><path d="M70 96H70" stroke="#d98b1f" stroke-width="4"/></svg>',
  birddog:'<svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg"><g stroke="#2f7d6d" stroke-width="5" fill="none" stroke-linecap="round"><circle cx="55" cy="78" r="13"/><path d="M68 85H150"/><path d="M70 85V122"/><path d="M150 85V122"/><path d="M150 122H174"/></g><path d="M70 85L40 72" stroke="#d98b1f" stroke-width="4" stroke-linecap="round"/><path d="M36 71l10-1-4 8z" fill="#d98b1f"/><path d="M150 85L184 74" stroke="#d98b1f" stroke-width="4" stroke-linecap="round"/><path d="M188 73l-10-1 4 8z" fill="#d98b1f"/></svg>'
};

var NECK=[
  {name:'腹式呼吸', cue:'躺或坐，一只手放肚子上；吸气肚子鼓，呼气慢，肩膀不动，做 1 分钟。', svg:'breath'},

function esc(v){
  return String(v==null?'':v).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function pad(n){return String(n).padStart(2,'0');}
function today(){
  var d=new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function fmtDate(s){
  if(!s) return '';
  var p=s.split('-');
  return (+p[1])+'月'+(+p[2])+'日';
}
function addDays(ds,n){
  var p=ds.split('-');
  var d=new Date(+p[0], +p[1]-1, +p[2]);
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function weekday(ds){
  var p=ds.split('-');
  var d=new Date(+p[0], +p[1]-1, +p[2]);
  return '周'+'日一二三四五六'.charAt(d.getDay());
}
function nowMs(){return Date.now();}
var idSeq=0;
function newId(){ idSeq++; return nowMs()*1000+idSeq; }

var storageOK=true;
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){
      var s=JSON.parse(raw);
      if(s && Array.isArray(s.sessions)){
        return {
          sessions:s.sessions,
          body:Array.isArray(s.body)?s.body:[],
          food:Array.isArray(s.food)?s.food:[],
          daily:(s.daily&&typeof s.daily==='object')?s.daily:{}
        };
      }
    }
  }catch(e){ storageOK=false; }
  return {sessions:[],body:[],food:[],daily:{}};
}

  return state.sessions.length<6 ? Math.min(2,def.sets) : def.sets;

  var last=state.sessions[state.sessions.length-1];
  return last && last.type==='A' ? 'B' : 'A';
}
function weekNo(){ return Math.floor(state.sessions.length/3)+1; }
function phaseHint(){
  var n=state.sessions.length;
  if(n<6) return '前两周：每个动作只做 2 组，先把动作做顺，不追求重量。';
  return '第 3 周起：每个动作 3 组，动作放慢，下放数 3 秒。';
}
function dailyArr(){
  var d=today();
  if(!state.daily[d]) state.daily[d]=DAILY.map(function(){return false;});
  return state.daily[d];
}
function streak(){
  var n=0, d=today();
  var a=state.daily[d];
  if(!a || !a.some(Boolean)) d=addDays(d,-1);
  while(n<365){
    var x=state.daily[d];
    if(!x || !x.some(Boolean)) break;
    n++; d=addDays(d,-1);
  }
  return n;
}

function foodTotals(list){

    t.p+=parseFloat(e.p)||0;
    t.c+=parseFloat(e.c)||0;

  },{kcal:0,p:0,c:0,f:0});

function macroRow(name,v,tg,unit){
  var pct=Math.min(100,Math.round(v/tg*100));
  return '<div class="macro"><div class="macro-top"><span>'+name+'</span><b>'+Math.round(v)+'<em>/'+tg+unit+'</em></b></div>'
    + '<div class="bar sm"><i class="'+(v>tg?'over':'')+'" style="width:'+pct+'%"></i></div></div>';
}
function parseFoodLines(text, baseDate){
  var out=[];
  text.split(/\r?\n/).forEach(function(line){
    line=line.trim();
    if(!line) return;
    var parts=line.split(/[|｜\t]/).map(function(x){return x.trim();}).filter(function(x){return x!=='';});
    if(parts.length<3) return;
    var i=0, date=baseDate, meal='', note='';
    var m0=parts[i].match(/^(\d{1,2})月(\d{1,2})日$/);
    var m1=parts[i].match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    var m2=parts[i].match(/^(\d{1,2})-(\d{1,2})$/);
    if(m0){ date=baseDate.substring(0,4)+'-'+pad(m0[1])+'-'+pad(m0[2]); i++; }
    else if(m1){ date=m1[1]+'-'+pad(m1[2])+'-'+pad(m1[3]); i++; }
    else if(m2){ date=baseDate.substring(0,4)+'-'+pad(m2[1])+'-'+pad(m2[2]); i++; }
    if(i<parts.length && /^(早餐|午餐|晚餐|加餐|夜宵|零食|全天)$/.test(parts[i])){ meal=parts[i]; i++; }
    if(i<parts.length && !/^[\d.]+$/.test(parts[i]) && !/^\d+(\.\d+)?\s*(kcal|千卡|g|克)$/i.test(parts[i])){ note=parts[i]; i++; }
    var nums=[];
    for(;i<parts.length;i++){
      var clean=parts[i].replace(/[^\d.]/g,'');
      if(clean && !isNaN(parseFloat(clean))) nums.push(parseFloat(clean));
    }
    if(!nums.length) return;
    out.push({date:date, meal:meal||'加餐', note:note, kcal:Math.round(nums[0]||0), p:Math.round(nums[1]||0), c:Math.round(nums[2]||0), f:Math.round(nums[3]||0)});
  });
  return out;
}

    +     '<div class="grid2">'
    +       '<label>餐次<select id="fMeal"><option>早餐</option><option>午餐</option><option>晚餐</option><option>加餐</option></select></label>'
    +       '<label>热量 kcal<input type="number" id="fKcal" inputmode="numeric" placeholder="500"></label>'
    +       '<label>蛋白质 g<input type="number" id="fP" inputmode="decimal" placeholder="25"></label>'
    +       '<label>碳水 g<input type="number" id="fC" inputmode="decimal" placeholder="选填"></label>'
    +       '<label>脂肪 g<input type="number" id="fF" inputmode="decimal" placeholder="选填"></label>'
    +       '<label>说明<input type="text" id="fNote" placeholder="米饭+鱼+青菜"></label>'
    +     '</div>'
    +     '<button class="btn primary" type="submit" style="margin-top:10px">加到 '+fmtDate(foodDate)+'</button>'
    +   '</form>'
    + '</div></details>';
}

/* ---------- 身体 ---------- */
function viewBody(){
  var rows=state.body.slice().sort(function(a,b){return b.date.localeCompare(a.date);});
  var first=rows[rows.length-1], latest=rows[0];
  var summary='';
  if(rows.length>=2 && latest && first){
    var dw=latest.weight-first.weight;
    var dwa=(latest.waist && first.waist) ? (latest.waist-first.waist) : null;
    summary='<div class="card"><div class="card-title">变化</div><div class="muted">'
      + '体重 '+(dw>0?'+':'')+dw.toFixed(1)+' kg'
      + (dwa!==null ? ' · 腰围 '+(dwa>0?'+':'')+dwa.toFixed(1)+' cm' : '')
      + '<br>'+fmtDate(first.date)+' → '+fmtDate(latest.date)+'</div></div>';
  }

  var list=rows.length
    ? '<div class="card"><div class="card-title">历史</div>'
      + rows.map(function(r){
          return '<div class="body-row"><span>'+fmtDate(r.date)+'</span><span>'+r.weight+' kg</span><span>'+(r.waist?r.waist+' cm':'—')+'</span></div>';
        }).join('')
      + '</div>'
    : '<div class="card empty">还没有身体数据。<br>每周固定 2–3 次晨起空腹称重。</div>';

  return '<form class="card" id="bodyForm">'
    + '<div class="card-title">记录身体数据</div>'
    + '<label class="dateline">日期<input type="date" id="bDate" value="'+today()+'"></label>'
    + '<div class="grid2">'
    +   '<label>体重 kg<input type="number" id="bWeight" inputmode="decimal" step="0.1" placeholder="57.5"></label>'
    +   '<label>腰围 cm<input type="number" id="bWaist" inputmode="decimal" step="0.1" placeholder="选填"></label>'
    + '</div>'
    + '<button class="btn primary" type="submit">保存</button>'
    + '<p class="hint">同一天重复填写会覆盖当天数据。</p>'
    + '</form>'
    + summary + list;
}

function render(){
  var app=document.getElementById('app');
  app.innerHTML = tab==='train' ? viewTrain() : tab==='history' ? viewHistory() : tab==='food' ? viewFood() : viewBody();
  var arr=dailyArr();
  document.getElementById('subtitle').textContent='已训练 '+state.sessions.length+' 次 · 今日打卡 '+arr.filter(Boolean).length+'/'+NECK.length;
  var btns=document.querySelectorAll('#tabbar button');
  for(var i=0;i<btns.length;i++){
    btns[i].classList.toggle('active', btns[i].dataset.tab===tab);
  }
}

/* ---------- 训练流程 ---------- */
function buildDraft(type){
  var last=null;
  for(var i=state.sessions.length-1;i>=0;i--){
    if(state.sessions[i].type===type){ last=state.sessions[i]; break; }
  }
  var entries=EX[type].map(function(def){
    var prev=null;
    if(last){
      for(var j=0;j<last.entries.length;j++){
        if(last.entries[j].id===def.id){ prev=last.entries[j]; break; }
      }
    }
    var count=sessionSetCount(def);
    var sets=[];
    for(var k=0;k<count;k++){
      var p=prev ? (prev.sets[k] || prev.sets[prev.sets.length-1]) : null;
      sets.push({w:p?p.w:'', r:p?p.r:'', done:false});
    }
    return {id:def.id, name:def.name, first:!prev, sets:sets};
  });
  return {type:type, date:today(), start:nowMs(), entries:entries};
}

function toggleSet(ei,si,el){
  var s=draft.entries[ei].sets[si];
  s.done=!s.done;
  if(el) el.classList.toggle('on', s.done);
  if(s.done) startRest(EX[draft.type][ei].rest);
  saveDraft();
  var c=document.getElementById('doneCount');
  if(c) c.textContent=doneCount();
}

function finish(){
  if(!draft) return;
  var any=false, sets=0, volume=0;
  var entries=draft.entries.map(function(e){
    var ds=e.sets.filter(function(s){return s.done;}).map(function(s){
      return {w:parseFloat(s.w)||0, r:parseFloat(s.r)||0};
    });
    if(ds.length) any=true;
    sets+=ds.length;
    return {id:e.id, name:e.name, sets:ds};
  }).filter(function(e){return e.sets.length;});

  if(!any){ toast('至少完成一组再结束'); return; }

  entries.forEach(function(e){
    var def=null;
    EX[draft.type].forEach(function(x){ if(x.id===e.id) def=x; });
    if(def && def.time) return;
    e.sets.forEach(function(x){ volume += x.w*x.r; });
  });

  var s={
    id:newId(),
    date:draft.date,
    type:draft.type,
    entries:entries,
    sets:sets,
    volume:Math.round(volume),
    minutes:Math.max(1,Math.round((nowMs()-draft.start)/60000))
  };
  state.sessions.push(s);
  save();
  draft=null;
  saveDraft();
  stopRest();
  render();
  showSummary(s);
}

/* ---------- 休息计时 ---------- */
function startRest(sec){
  restEnd=nowMs()+sec*1000;
  if(restTimer) clearInterval(restTimer);
  restTimer=setInterval(tickRest,300);
  tickRest();
}
function tickRest(){
  var bar=document.getElementById('restbar');
  if(!bar) return;
  var left=Math.max(0,Math.ceil((restEnd-nowMs())/1000));
  if(left<=0){ stopRest(); if(navigator.vibrate) navigator.vibrate([220,120,220]); toast('休息结束，开始下一组'); return; }
  bar.hidden=false;
  bar.querySelector('.t').textContent=Math.floor(left/60)+':'+pad(left%60);
}
function stopRest(){
  if(restTimer){ clearInterval(restTimer); restTimer=null; }
  restEnd=0;
  var bar=document.getElementById('restbar');
  if(bar) bar.hidden=true;
}

/* ---------- 弹窗 ---------- */
var modal=document.getElementById('modal');

function imgTag(folder,idx){
  var cdn='https://cdn.jsdelivr.net/gh/yuhonas/free-exercise-db@main/exercises/'+folder+'/'+idx+'.jpg';
  var raw='https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/'+folder+'/'+idx+'.jpg';
  return '<img src="'+cdn+'" data-raw="'+raw+'" alt="" loading="lazy">';
}
function findEx(id){
  var all=EX.A.concat(EX.B);
  for(var i=0;i<all.length;i++){ if(all[i].id===id) return all[i]; }
  return null;
}
function openDemo(kind,id){
  var title='', cue='', note='', media='', videoName='';
  if(kind==='ex'){
    var ex=findEx(id);
    if(!ex) return;
    title=ex.name; cue=ex.cue; note=ex.note||''; videoName=ex.name;
    if(ex.svg){
      media='<div class="diagram">'+SVG[ex.svg]+'</div>';
    } else if(ex.img){
      media='<div class="demo-grid">'
        + '<figure>'+imgTag(ex.img,0)+'<figcaption>起始</figcaption></figure>'
        + '<figure>'+imgTag(ex.img,1)+'<figcaption>结束</figcaption></figure>'
        + '</div>';
    }
  } else {
    var n=NECK[+id];
    if(!n) return;
    title=n.name; cue=n.cue; videoName=n.name;
    media='<div class="diagram">'+SVG[n.svg]+'</div>';
  }
  modal.innerHTML='<div class="sheet">'
    + '<h3>'+esc(title)+'</h3>'
    + media
    + (note?'<p class="hint" style="margin-top:0">'+esc(note)+'</p>':'')
    + '<p style="margin:0 0 4px">'+esc(cue)+'</p>'
    + '<a class="btn" href="https://search.bilibili.com/all?keyword='+encodeURIComponent(videoName+' 教学 正确动作')+'" target="_blank" rel="noopener">看视频示范</a>'
    + '<button class="btn primary" data-act="close">关闭</button>'
    + '</div>';
  modal.hidden=false;
}

function showSummary(s){
  modal.innerHTML='<div class="sheet">'
    + '<div class="big">✓</div>'
    + '<h3 style="text-align:center;margin-top:6px">训练完成</h3>'
    + '<p style="text-align:center">'+fmtDate(s.date)+' · 训练'+s.type+'</p>'
    + '<div class="stats"><div><b>'+s.sets+'</b><span>组</span></div>'
    + '<div><b>'+s.volume+'</b><span>kg 总容量</span></div>'
    + '<div><b>'+s.minutes+'</b><span>分钟</span></div></div>'
    + '<button class="btn primary" data-act="close">好</button>'
    + '</div>';
  modal.hidden=false;
}
function openSettings(){
  modal.innerHTML='<div class="sheet">'
    + '<h3>设置与备份</h3>'
    + '<p>记录只存在这台手机的浏览器里。换手机或清理数据前，先导出备份。</p>'
    + '<button class="btn" data-act="export">导出备份</button>'
    + '<label class="btn" for="importFile">导入备份</label>'
    + '<input id="importFile" type="file" accept=".json,application/json" hidden>'
    + '<button class="btn danger" data-act="clear">清空全部记录</button>'
    + '<button class="btn primary" data-act="close">关闭</button>'
    + '</div>';
  modal.hidden=false;
}
var toastT=null;
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  if(toastT) clearTimeout(toastT);
  toastT=setTimeout(function(){ t.classList.remove('show'); },2200);
}
function closeModal(){
  modal.hidden=true;
  modal.innerHTML='';
}

/* ---------- 事件 ---------- */

document.addEventListener('error', function(ev){
  var img=ev.target;
  if(img && img.tagName==='IMG' && img.dataset && img.dataset.raw && !img.dataset.fb){
    img.dataset.fb='1';
    img.src=img.dataset.raw;
  }
}, true);

document.addEventListener('click', function(ev){
  var el=ev.target.closest('[data-act]');
  if(!el) return;
  var act=el.dataset.act;

  if(act==='tab'){ tab=el.dataset.tab; render(); return; }
  if(act==='start'){
    if(draft && !confirm('有未完成的训练，要放弃重新开始吗？')) return;
    draft=buildDraft(el.dataset.type);
    saveDraft(); render(); return;
  }
  if(act==='toggle'){ toggleSet(+el.dataset.ex, +el.dataset.set, el); return; }
  if(act==='finish'){ finish(); return; }
  if(act==='cancel'){
    if(confirm('放弃本次训练？已填写的内容会丢失。')){
      draft=null; saveDraft(); stopRest(); render();
    }
    return;
  }
  if(act==='daily'){
    var i=+el.dataset.i;
    var arr=dailyArr();
    arr[i]=!arr[i];
    save(); render();
    return;
  }
  if(act==='skip'){ stopRest(); return; }
  if(act==='addrest'){ if(restEnd){ restEnd+=30000; tickRest(); } return; }
  if(act==='del'){
    if(confirm('删除这条训练记录？')){
      var id=+el.dataset.id;
      state.sessions=state.sessions.filter(function(x){return x.id!==id;});
      save(); render();
    }
    return;
  }
  if(act==='prevday'){ foodDate=addDays(foodDate,-1); render(); return; }
  if(act==='nextday'){ foodDate=addDays(foodDate,1); render(); return; }
  if(act==='delfood'){
    var fid=+el.dataset.id;
    state.food=state.food.filter(function(x){return x.id!==fid;});
    save(); render(); return;
  }
  if(act==='copyyesterday'){
    var src=foodOf(addDays(foodDate,-1));
    if(!src.length){ toast('昨天没有记录，先手动加一次'); return; }
    var have=foodOf(foodDate).length;
    if(have && !confirm('当天已有 '+have+' 条，仍要追加昨天的 '+src.length+' 条吗？')) return;
    src.forEach(function(e){
      state.food.push({id:newId(),date:foodDate,meal:e.meal,note:e.note,kcal:e.kcal,p:e.p,c:e.c,f:e.f});
    });
    save(); render(); toast('已复制 '+src.length+' 条'); return;
  }
  if(act==='openpaste'){
    var box=document.getElementById('pastebox');
    if(box){
      box.hidden=!box.hidden;
      if(!box.hidden) document.getElementById('fPaste').focus();
    }
    return;
  }
  if(act==='parsepaste'){
    var ta=document.getElementById('fPaste');
    var items=parseFoodLines(ta?ta.value:'', foodDate);
    if(!items.length){ toast('没识别到，检查格式'); return; }
    items.forEach(function(it){
      state.food.push({id:newId(),date:it.date,meal:it.meal,note:it.note,kcal:it.kcal,p:it.p,c:it.c,f:it.f});
    });
    foodDate=items[items.length-1].date;
    save(); render(); toast('已添加 '+items.length+' 条'); return;
  }
  if(act==='demo'){ openDemo(el.dataset.kind, el.dataset.id); return; }
  if(act==='settings'){ openSettings(); return; }
  if(act==='close'){ closeModal(); return; }
  if(act==='export'){ doExport(); return; }
  if(act==='clear'){
    if(confirm('确定清空全部记录？') && confirm('再确认一次：清空后无法找回。')){
      state={sessions:[],body:[],food:[],daily:{}};
      draft=null; save(); saveDraft(); closeModal(); render(); toast('已清空');
    }
    return;
  }
});

document.addEventListener('input', function(ev){
  var inp=ev.target.closest('input[data-ex]');
  if(!inp || !draft) return;
  var ei=+inp.dataset.ex, si=+inp.dataset.set, field=inp.dataset.field;
  if(!draft.entries[ei] || !draft.entries[ei].sets[si]) return;
  draft.entries[ei].sets[si][field]=inp.value;
  if(saveT) clearTimeout(saveT);
  saveT=setTimeout(saveDraft,300);
});

document.addEventListener('submit', function(ev){
  if(ev.target.id==='foodForm'){
    ev.preventDefault();
    var kcal=parseFloat(document.getElementById('fKcal').value)||0;
    var p=parseFloat(document.getElementById('fP').value)||0;
    var c=parseFloat(document.getElementById('fC').value)||0;
    var f=parseFloat(document.getElementById('fF').value)||0;
    if(kcal<=0 && p<=0){ toast('至少填热量或蛋白质'); return; }
    state.food.push({
      id:newId(), date:foodDate,
      meal:document.getElementById('fMeal').value,
      note:(document.getElementById('fNote').value||'').trim(),
      kcal:Math.round(kcal), p:Math.round(p), c:Math.round(c), f:Math.round(f)
    });
    save(); render(); toast('已添加'); return;
  }
  if(ev.target.id!=='bodyForm') return;
  ev.preventDefault();
  var d=document.getElementById('bDate').value || today();
  var w=parseFloat(document.getElementById('bWeight').value);
  var wa=parseFloat(document.getElementById('bWaist').value);
  if(!(w>0)){ toast('请填写体重'); return; }
  var rec={date:d, weight:Math.round(w*10)/10, waist:(wa>0?Math.round(wa*10)/10:null)};
  var replaced=false;
  for(var i=0;i<state.body.length;i++){
    if(state.body[i].date===d){ state.body[i]=rec; replaced=true; break; }
  }
  if(!replaced) state.body.push(rec);
  save(); render(); toast('已保存');
});

document.addEventListener('change', function(ev){
  if(ev.target.id!=='importFile') return;
  var f=ev.target.files && ev.target.files[0];
  if(!f) return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var data=JSON.parse(String(reader.result));
      if(!data || !Array.isArray(data.sessions)) throw new Error('bad');
      if(!confirm('导入会覆盖当前全部记录，确定吗？')) return;
      state={
        sessions:data.sessions,
        body:Array.isArray(data.body)?data.body:[],
        food:Array.isArray(data.food)?data.food:[],
        daily:(data.daily&&typeof data.daily==='object')?data.daily:{}
      };
      draft=null; save(); saveDraft(); closeModal(); render(); toast('导入成功');
    }catch(e){ toast('文件格式不正确'); }
  };
  reader.readAsText(f);
});

function doExport(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='mom-fitlog-'+today()+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },1500);
  toast('已导出备份');
}

render();
})();
</script>
</body>
</html>
